<script>
const API='https://ibaraholka-bot.onrender.com';
const EMOJI={iphone:'📱',airpods:'🎧',ipad:'💻',mac:'💻',watch:'⌚',accs:'🔌'};
const CATS=[{k:'all',l:'Все',e:'🍎'},{k:'iphone',l:'iPhone',e:'📱'},{k:'airpods',l:'AirPods',e:'🎧'},{k:'ipad',l:'iPad',e:'💻'},{k:'mac',l:'Mac',e:'💻'},{k:'watch',l:'Watch',e:'⌚'},{k:'accs',l:'Акс',e:'🔌'}];

let allListings=[];
let favSet=new Set();
let activeCat='all';
let searchQ='';
let myId=null;

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const haptic=(k='light')=>{try{const tg=window.Telegram?.WebApp;tg?.HapticFeedback?.impactOccurred(k);}catch(_){}};
const toast=(m)=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);};
const auth=()=>{const tg=window.Telegram?.WebApp;return tg?.initData?{Authorization:'tma '+tg.initData}:{};};
const me=()=>{const tg=window.Telegram?.WebApp;return tg?.initDataUnsafe?.user||null;};
const openLink=(u)=>{const tg=window.Telegram?.WebApp;if(tg?.openLink){tg.openLink(u);}else{window.open(u,'_blank');}};
const closeModal=()=>{document.querySelectorAll('.mbg').forEach(m=>m.remove());};

async function apiGet(p){const r=await fetch(API+p,{cache:'no-store',headers:auth()});if(!r.ok)throw new Error(r.status);return await r.json();}
async function apiPost(p,b){const r=await fetch(API+p,{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify(b||{})});if(!r.ok)throw new Error(r.status);return await r.json();}
async function apiDelete(p){const r=await fetch(API+p,{method:'DELETE',headers:auth()});if(!r.ok)throw new Error(r.status);return await r.json();}

async function load(){
  $('list').innerHTML='<div style="text-align:center;padding:30px;color:#a1a1aa">Загрузка…</div>';
  try{
    const data=await apiGet('/listings?cb='+Date.now());
    if(!Array.isArray(data)) throw new Error('Не массив');
    allListings=data;
    const todayStart=Math.floor(Date.now()/1000)-86400;
    $('sTotal').textContent=data.length;
    $('sToday').textContent=data.filter(l=>{const c=l.created||0;const cs=c>1e10?Math.floor(c/1000):c;return cs>=todayStart;}).length;
    $('sAvail').textContent=data.filter(l=>l.status!=='sold'&&l.status!=='archived').length;
    $('err').innerHTML='';
    if(me()){
      myId=me().id;
      try{
        const favs=await apiGet('/favorites');
        if(Array.isArray(favs.favorites)) favSet=new Set(favs.favorites.map(f=>f.id||f.listing_id));
      }catch(_){}
    }
    render();
  }catch(e){
    $('err').innerHTML='<div class="err">❌ '+esc(e.message)+'</div>';
    $('list').innerHTML='<button class="btn-cta" onclick="load()">Повторить</button>';
  }
}

function render(){
  const q=searchQ.toLowerCase();
  const filtered=allListings.filter(l=>{
    if(activeCat!=='all'&&l.cat!==activeCat) return false;
    if(q){const text=((l.title||'')+' '+(l.description||'')).toLowerCase();if(!text.includes(q)) return false;}
    return true;
  });
  const list=$('list');
  if(filtered.length===0){
    list.innerHTML=`<div class="empty">
      <img src="empty-3d.jpeg" alt="">
      <div class="empty-t">${allListings.length===0?'Здесь пока тишина':'Ничего не найдено'}</div>
      <div class="empty-s">${allListings.length===0?'Будь первым — продай или найди своё':'Попробуй другой запрос'}</div>
    </div>`;
    return;
  }
  list.innerHTML=filtered.map(l=>{
    const emoji=EMOJI[l.cat]||'📦';
    const title=esc(l.title||'(без названия)');
    const username=esc(l.user_username||l.user_name||'?');
    let badge='<span class="badge">Free</span>';
    if(l.tier==='vip') badge='<span class="badge vip">👑 VIP</span>';
    else if(l.tier==='premium'||l.tier==='top') badge='<span class="badge top">⭐ TOP</span>';
    const c=l.created||0; const cs=c>1e10?Math.floor(c/1000):c;
    const date=new Date(cs*1000).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
    const price=Number(l.price||0).toLocaleString('ru-RU');
    const id=esc(l.id);
    const isFav=favSet.has(l.id);
    const favIcon=isFav?'❤️':'🤍';
    const favCls=isFav?'btn-icon fav-on':'btn-icon';
    return `<div class="card">
      <div class="emoji">${emoji}</div>
      <div class="body">
        <div class="row1">${badge}<span class="meta-sm">@${username} · ${date}</span></div>
        <h3 class="title">${title}</h3>
        <div class="price">${price} ₽</div>
        ${l.city?`<div class="city">📍 ${esc(l.city)}</div>`:''}
        <div class="btns">
          <button class="btn-write" onclick="onWrite(this.dataset.username, this.dataset.name)">💬 Написать</button>
          <button class="btn-guarant" onclick="onGuarant('${id}','${title.replace(/'/g,"\\'")}',${l.price||0})">🛡 Гарант</button>
          <button class="btn-icon" onclick="onShare('${id}','${title.replace(/'/g,"\\'")}')">📤</button>
          <button class="${favCls}" onclick="onFav(this,'${id}')">${favIcon}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Button handlers — exposed globally for inline onclick
window.onWrite=function(username,name){
  haptic('heavy');
  if(username){openLink('https://t.me/'+username);}
  else{toast('У продавца нет @username');}
};
window.onGuarant=function(id,title,price){
  haptic('medium');
  openGuarant(id,title,price);
};
window.onShare=function(id,title){
  haptic('light');
  shareListing(id,title);
};
window.onFav=async function(btn,id){
  haptic('light');
  if(!me()){toast('Открой через Telegram-бота');return;}
  try{
    const isFav=btn.classList.contains('fav-on');
    if(isFav){await apiDelete('/favorites/'+id);btn.classList.remove('fav-on');btn.textContent='🤍';toast('Удалено');}
    else{await apiPost('/favorites/'+id,{});btn.classList.add('fav-on');btn.textContent='❤️';toast('Добавлено');}
  }catch(err){toast('Ошибка: '+err.message);}
};

// Legacy event-delegation fallback (kept for older DOM)
document.addEventListener('click',e=>{
  if(window.Telegram?.WebApp?.HapticFeedback){
    const btn=e.target.closest('button, .filter, .nav-i, .btn-icon');
    if(btn){
      if(btn.classList.contains('btn-write')) window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
      else if(btn.classList.contains('btn-guarant')) window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
      else window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
    }
  }
});

function openGuarant(id,title,price){
  if(!me()){toast('Открой через Telegram-бота');return;}
  const html=`<div class="mbg"><div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>🛡 Покупка с гарантом</h2>
    <div class="sub">${title} · <b>${Number(price).toLocaleString('ru-RU')} ₽</b></div>
    <div class="row"><label>Адрес доставки</label><input id="gAddr" placeholder="ул. Пушкина, д. 10, кв. 5" minlength="5" required></div>
    <div class="row"><label>Город</label><input id="gCity" placeholder="Москва"></div>
    <label style="font-size:12px;color:#a1a1aa;margin:10px 0 4px;display:block">Способ оплаты</label>
    <div class="pmethods">
      <div class="pmethod active" data-m="tinkoff"><div class="pmethod-icon">💳</div>Тинькофф</div>
      <div class="pmethod" data-m="ton"><div class="pmethod-icon">💎</div>TON</div>
    </div>
    <button class="btn-cta" style="width:100%" id="gGo">Создать сделку</button>
    <div id="gMsg" style="margin-top:10px;font-size:12px;color:#a1a1aa"></div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  document.querySelectorAll('.pmethod').forEach(el=>el.addEventListener('click',()=>{
    document.querySelectorAll('.pmethod').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
  }));
  $('gGo').addEventListener('click',async()=>{
    const addr=$('gAddr').value.trim();
    const city=$('gCity').value.trim();
    const m=document.querySelector('.pmethod.active')?.dataset.m||'tinkoff';
    if(addr.length<5){$('gMsg').textContent='❌ Введите полный адрес';return;}
    $('gMsg').textContent='Создаём сделку…';
    try{
      const r=await apiPost('/deals/create',{listing_id:id,payment_method:m,shipping_address:addr,shipping_city:city});
      if(!r.ok){$('gMsg').textContent='❌ '+(r.error||'Ошибка');return;}
      $('gMsg').innerHTML='✅ Сделка <b>'+esc(r.deal_id)+'</b> создана. Инструкции по оплате:<br><br>'+
        (r.payment?.method==='ton'?`<div class="copy-link">${esc(r.payment.wallet)}<br>Сумма: ${r.payment.amount_ton} TON<br>Комментарий: ${esc(r.payment.comment)}</div>`:
        `<div style="font-size:13px">Переведите <b>${r.payment?.amount_rub||price} ₽</b> на карту:<br><div class="copy-link">${esc(r.payment?.card||'')}</div>В комментарии укажите: <b>${esc(r.deal_id)}</b></div>`);
      toast('Сделка создана');
    }catch(err){$('gMsg').textContent='❌ '+err.message;}
  });
}

function shareListing(id,title){
  const url=`https://t.me/Ibaraholka_bot?startapp=list_${id}`;
  const tg=window.Telegram?.WebApp;
  if(tg?.openTelegramLink){tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`);}
  else if(navigator.share){navigator.share({title,url});}
  else{navigator.clipboard?.writeText(url);toast('Ссылка скопирована');}
}

// Profile / Match / Refs modals
async function openProfile(){
  if(!me()){toast('Открой через Telegram-бота');return;}
  try{
    const r=await apiGet('/profile/me');
    const u=me();
    const html=`<div class="mbg"><div class="modal" style="position:relative">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>👤 ${esc(u.first_name||'Профиль')}</h2>
      <div class="sub">@${esc(u.username||'')} · ID ${u.id}</div>
      <div class="profile-grid">
        <div class="profile-card"><div class="l">Объявления</div><div class="v">${r.listings_active||0}</div></div>
        <div class="profile-card"><div class="l">IB Coins</div><div class="v">${r.balance?.coins||0} ⭐</div></div>
        <div class="profile-card"><div class="l">Подписки</div><div class="v">${r.match_subs?.length||0}</div></div>
        <div class="profile-card"><div class="l">Рефералы</div><div class="v">${r.referrals_count||0}</div></div>
      </div>
      <div class="mt-row"><div class="mt-l">Сделки</div><div class="mt-v">${r.deals?.length||0}</div></div>
      <div class="mt-row"><div class="mt-l">Избранное</div><div class="mt-v">${r.favorites_count||0}</div></div>
      <div class="mt-row"><div class="mt-l">Рейтинг продавца</div><div class="mt-v">${r.seller_rating?.avg_rating?r.seller_rating.avg_rating.toFixed(1)+' ⭐':'-'}</div></div>
      <div class="mt-row"><div class="mt-l">VIP до</div><div class="mt-v">${r.vip_until?new Date(r.vip_until*1000).toLocaleDateString('ru-RU'):'—'}</div></div>
    </div></div>`;
    document.body.insertAdjacentHTML('beforeend',html);
  }catch(err){toast('Ошибка: '+err.message);}
}

async function openMatch(){
  if(!me()){toast('Открой через Telegram-бота');return;}
  try{
    const subs=await apiGet('/match/subscriptions');
    const list=Array.isArray(subs.subscriptions)?subs.subscriptions:[];
    const html=`<div class="mbg"><div class="modal" style="position:relative">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>🔔 Бот-подбиратель</h2>
      <div class="sub">Скажи боту что ищешь — он оповестит о новых объявлениях</div>
      <div class="row"><label>Что ищешь?</label><input id="mQ" placeholder="напр. iPhone 13 до 30К в Москве"></div>
      <button class="btn-cta" style="width:100%" id="mGo">Создать подписку</button>
      <div id="mMsg" style="margin-top:10px;font-size:12px"></div>
      <h3 style="font-size:14px;margin:18px 0 8px;color:#a1a1aa">Активные (${list.length})</h3>
      ${list.length===0?'<div style="color:#71717a;font-size:13px">Пока нет подписок</div>':''}
      ${list.map(s=>`<div class="mt-row"><div><div style="font-weight:600">${esc(s.query||'')}</div><div style="font-size:11px;color:#a1a1aa">${esc(s.filters?.cat||'?')} · до ${s.filters?.max_price||'?'} ₽${s.filters?.city?' · '+esc(s.filters.city):''}</div></div><button class="btn-icon" data-unsub="${esc(s.id)}">✕</button></div>`).join('')}
    </div></div>`;
    document.body.insertAdjacentHTML('beforeend',html);
    $('mGo').addEventListener('click',async()=>{
      const q=$('mQ').value.trim();
      if(!q){$('mMsg').textContent='Введите запрос';return;}
      $('mMsg').textContent='Создаём…';
      try{
        const r=await apiPost('/match/subscribe',{query:q});
        if(r.ok){$('mMsg').textContent='✅ Подписка создана: '+r.subscription_id;setTimeout(closeModal,1500);load();}
        else if(r.payment_required){$('mMsg').innerHTML='⚠️ Первая бесплатная уже использована. Стоимость: '+r.need_payment+' монет';}
        else $('mMsg').textContent='❌ '+(r.error||'Ошибка');
      }catch(err){$('mMsg').textContent='❌ '+err.message;}
    });
    document.querySelectorAll('[data-unsub]').forEach(el=>el.addEventListener('click',async()=>{
      try{await apiDelete('/match/subscriptions/'+el.dataset.unsub);toast('Удалено');el.closest('.mt-row').remove();}
      catch(err){toast('Ошибка: '+err.message);}
    }));
  }catch(err){toast('Ошибка: '+err.message);}
}

      <div style="text-align:center;margin:10px 0"><b style="font-size:24px;color:#fb923c">${count}</b> <span style="color:#a1a1aa">друзей привели</span></div>

      <div class="mt-row"><div class="mt-l">3 друга</div><div class="mt-v">${got.find(b=>b.milestone===3)?'✅':'🎁'} 10 монет</div></div>
      <div class="mt-row"><div class="mt-l">5 друзей</div><div class="mt-v">${got.find(b=>b.milestone===5)?'✅':'🎁'} 1 день VIP</div></div>
      <div class="mt-row"><div class="mt-l">15 друзей</div><div class="mt-v">${got.find(b=>b.milestone===15)?'✅':'🎁'} 3 дня VIP</div></div>
      <div class="mt-row"><div class="mt-l">25 друзей</div><div class="mt-v">${got.find(b=>b.milestone===25)?'✅':'🎁'} неделя VIP</div></div>
    </div></div>`;
    document.body.insertAdjacentHTML('beforeend',html);
  }catch(err){toast('Ошибка: '+err.message);}
}

document.getElementById('q').addEventListener('input',e=>{searchQ=e.target.value;render();});

document.querySelectorAll('.filter').forEach(el=>el.addEventListener('click',()=>{
  activeCat=el.dataset.k;buildFilters();render();
}));

document.querySelectorAll('.nav-i').forEach(el=>el.addEventListener('click',()=>{
  document.querySelectorAll('.nav-i').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  haptic('light');
  const t=el.dataset.t;
  if(t==='profile') openProfile();
  else if(t==='match') openMatch();
  else if(t==='refs') openRefs();
  else if(t==='feed'){closeModal();}
}));

function buildFilters(){
  $('filters').innerHTML=CATS.map(c=>`<div class="filter ${activeCat===c.k?'active':''}" data-k="${c.k}">${c.e} ${c.l}</div>`).join('');
  document.querySelectorAll('.filter').forEach(el=>el.addEventListener('click',()=>{activeCat=el.dataset.k;buildFilters();render();}));
}

buildFilters();
const tg=window.Telegram?.WebApp;const m=document.getElementById('vmark');
if(tg){tg.ready();tg.expand();setTimeout(()=>{if(m)m.style.display='none';},5000);}

load();
