services:
  - type: web
    name: ibaraholka-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DEMO_MODE
        value: "1"
